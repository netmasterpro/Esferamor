<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esfera 3D Love</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
    perspective:1600px;
}

/* Fondo dibujo */

.bg{
    position:fixed;
    inset:0;
    background:url("1000854425.jpg") center center/cover no-repeat;
    opacity:0.22;
    filter:blur(1px);
    z-index:-3;
}

/* Luces */

.light{
    position:absolute;
    width:400px;
    height:400px;
    border-radius:50%;
    filter:blur(90px);
    opacity:.5;
    animation:move 8s infinite alternate ease-in-out;
}

.light1{
    background:#00ccff;
    top:-120px;
    left:-120px;
}

.light2{
    background:#ff00d4;
    bottom:-120px;
    right:-120px;
}

@keyframes move{
    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(40px,-30px);
    }
}

.scene{
    position:relative;
    width:420px;
    height:420px;
    transform-style:preserve-3d;
}

/* ESFERA */

.globe{
    width:100%;
    height:100%;
    border-radius:50%;
    position:relative;
    overflow:hidden;
    cursor:grab;

    background:
    radial-gradient(circle at 30% 20%,
    rgba(255,255,255,.85),
    rgba(255,255,255,.1) 30%,
    rgba(0,50,90,.95) 100%);

    border:8px solid rgba(255,255,255,.2);

    box-shadow:
    inset 0 0 30px rgba(255,255,255,.3),
    0 0 60px rgba(0,255,255,.2),
    0 0 140px rgba(0,180,255,.2);

    transform-style:preserve-3d;

    animation:float 4s ease-in-out infinite;
}

@keyframes float{

    0%,100%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-10px);
    }

}

/* Reflejo vidrio */

.reflection{
    position:absolute;
    width:120px;
    height:240px;
    border-radius:50%;
    background:linear-gradient(
    to bottom,
    rgba(255,255,255,.5),
    transparent);

    left:35px;
    top:20px;

    transform:rotate(-18deg);
}

/* Jardín */

.garden{
    position:absolute;
    width:100%;
    height:120px;
    bottom:0;
    background:
    linear-gradient(to top,
    #0d5f17,
    #32cd32);

    border-radius:50% 50% 0 0;

    overflow:hidden;
}

/* Pasto */

.grass{
    position:absolute;
    bottom:0;
    width:100%;
    height:40px;
    background:
    repeating-linear-gradient(
    90deg,
    #29c729 0px,
    #29c729 4px,
    #1c7e1c 5px,
    #1c7e1c 8px
    );
}

/* Flores */

.flower{
    position:absolute;
    width:12px;
    height:12px;
    background:pink;
    border-radius:50%;
    bottom:35px;
    box-shadow:
    12px 0 pink,
    -12px 0 pink,
    0 12px pink,
    0 -12px pink;
}

.f1{ left:50px; }
.f2{ left:120px; background:yellow; }
.f3{ right:80px; background:cyan; }
.f4{ right:150px; background:#ff66ff; }

/* FOTO */

.photo-container{
    position:absolute;
    left:50%;
    top:50%;
    transform-style:preserve-3d;
    transform:
    translate(-50%,-55%)
    rotateY(0deg);

    transition:transform .2s;
}

.photo{
    width:190px;
    height:190px;
    border-radius:50%;
    object-fit:cover;

    border:7px solid rgba(255,255,255,.7);

    box-shadow:
    0 0 30px rgba(255,255,255,.3),
    0 0 60px rgba(255,0,200,.25);

    animation:spinPhoto 10s linear infinite;
}

@keyframes spinPhoto{
    from{
        transform:rotateY(0deg);
    }

    to{
        transform:rotateY(360deg);
    }
}

/* Base */

.base{
    position:absolute;
    width:280px;
    height:95px;
    bottom:-65px;
    left:50%;
    transform:translateX(-50%);

    background:
    linear-gradient(to bottom,
    #74451d,
    #2d1507);

    border-radius:25px;

    box-shadow:
    inset 0 5px 10px rgba(255,255,255,.2),
    0 15px 25px rgba(0,0,0,.6);
}

.base::before{
    content:"❤ NAY ❤";
    position:absolute;
    left:50%;
    top:28px;
    transform:translateX(-50%);

    color:white;
    font-size:24px;
    font-weight:bold;
    letter-spacing:4px;

    text-shadow:
    0 0 10px #ff00ff,
    0 0 20px #00ffff;
}

/* nieve */

.snow{
    position:absolute;
    background:white;
    border-radius:50%;
    pointer-events:none;
    animation:fall linear forwards;
}

@keyframes fall{

    from{
        transform:translateY(-20px);
        opacity:1;
    }

    to{
        transform:translateY(450px);
        opacity:0;
    }

}

/* brillo */

.spark{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:white;

    box-shadow:
    0 0 10px white,
    0 0 20px cyan;

    animation:spark 1.5s linear forwards;
}

@keyframes spark{

    from{
        transform:scale(.2);
        opacity:1;
    }

    to{
        transform:
        translateY(-100px)
        scale(2);

        opacity:0;
    }

}

/* texto */

.text{
    position:absolute;
    top:25px;
    width:100%;
    text-align:center;
    color:white;
    z-index:20;

    text-shadow:
    0 0 10px rgba(255,255,255,.5);
}

.text h1{
    font-size:26px;
    letter-spacing:3px;
}

.text p{
    margin-top:8px;
    opacity:.8;
}

/* responsive */

@media(max-width:480px){

    .scene{
        width:330px;
        height:330px;
    }

    .photo{
        width:160px;
        height:160px;
    }

}

</style>
</head>
<body>

<div class="bg"></div>

<div class="light light1"></div>
<div class="light light2"></div>

<div class="text">
    <h1>❄ Mi Ojitos de Uva❤️ ❄</h1>
    <p>agita el celular o toca la esfera ✨</p>
</div>

<div class="scene">

    <div class="globe" id="globe">

        <div class="reflection"></div>

        <div class="photo-container" id="photoContainer">

            <img
            src="1000852526.jpg"
            class="photo">

        </div>

        <div class="garden">

            <div class="grass"></div>

            <div class="flower f1"></div>
            <div class="flower f2"></div>
            <div class="flower f3"></div>
            <div class="flower f4"></div>

        </div>

    </div>

    <div class="base"></div>

</div>

<audio id="music" autoplay loop>
<source src="https://files.catbox.moe/6r6q7l.mp3" type="audio/mpeg">
</audio>

<script>

const globe = document.getElementById("globe");
const photoContainer = document.getElementById("photoContainer");

function snow(amount=50){

    for(let i=0;i<amount;i++){

        const snow = document.createElement("div");

        snow.className="snow";

        const size=Math.random()*7+2;

        snow.style.width=size+"px";
        snow.style.height=size+"px";

        snow.style.left=Math.random()*100+"%";

        snow.style.top="-20px";

        snow.style.animationDuration=
        (Math.random()*3+2)+"s";

        globe.appendChild(snow);

        setTimeout(()=>{
            snow.remove();
        },5000);

    }

}

function sparks(amount=30){

    for(let i=0;i<amount;i++){

        const spark=document.createElement("div");

        spark.className="spark";

        spark.style.left=
        Math.random()*100+"%";

        spark.style.top=
        Math.random()*100+"%";

        globe.appendChild(spark);

        setTimeout(()=>{
            spark.remove();
        },1500);

    }

}

function shakeEffect(){

    globe.animate([

        { transform:'translateX(-8px)' },

        { transform:'translateX(8px)' },

        { transform:'translateX(-8px)' },

        { transform:'translateX(0px)' }

    ],{

        duration:500

    });

    snow(90);
    sparks(50);

}

/* click */

globe.addEventListener("click",()=>{

    shakeEffect();

});

/* mover esfera */

document.addEventListener("mousemove",(e)=>{

    const x =
    (window.innerWidth/2-e.pageX)/18;

    const y =
    (window.innerHeight/2-e.pageY)/18;

    globe.style.transform=
    `rotateY(${-x}deg)
     rotateX(${y}deg)`;

    photoContainer.style.transform=
    `translate(-50%,-55%)
     rotateY(${x*2}deg)`;

});

/* celular */

let lastX,lastY,lastZ;

window.addEventListener(
"devicemotion",
(event)=>{

const acc=
event.accelerationIncludingGravity;

if(!acc) return;

if(lastX!==undefined){

const total=
Math.abs(lastX-acc.x)+
Math.abs(lastY-acc.y)+
Math.abs(lastZ-acc.z);

if(total>22){

shakeEffect();

}

}

lastX=acc.x;
lastY=acc.y;
lastZ=acc.z;

});

/* nieve automática */

setInterval(()=>{

snow(10);

},1200);

/* música */

window.addEventListener("click",()=>{

document.getElementById("music").play();

},{once:true});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esfera 3D Love Premium</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
    perspective:1800px;
}

/* Fondo GitHub */

.bg{
    position:fixed;
    inset:0;

    background:
    url("./IMG-20260518-WA0012.jpg")
    center center/cover no-repeat;

    opacity:.20;

    filter:
    blur(2px)
    brightness(.7);

    z-index:-5;

    transform:scale(1.1);
}

/* Oscurecer fondo */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.35);
    z-index:-4;
}

/* Luces ambiente */

.light{
    position:absolute;
    width:450px;
    height:450px;
    border-radius:50%;
    filter:blur(100px);
    opacity:.5;
    animation:move 8s infinite alternate ease-in-out;
}

.light1{
    background:#00d9ff;
    top:-120px;
    left:-120px;
}

.light2{
    background:#ff00f2;
    bottom:-120px;
    right:-120px;
}

@keyframes move{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(40px,-30px);
    }

}

/* Texto */

.text{
    position:absolute;
    top:25px;
    width:100%;
    text-align:center;
    color:white;
    z-index:100;

    text-shadow:
    0 0 10px rgba(255,255,255,.6),
    0 0 20px rgba(0,255,255,.4);
}

.text h1{
    font-size:28px;
    letter-spacing:4px;
}

.text p{
    margin-top:10px;
    opacity:.85;
}

/* Escena */

.scene{
    position:relative;
    width:430px;
    height:430px;
    transform-style:preserve-3d;
}

/* ESFERA */

.globe{

    width:100%;
    height:100%;

    border-radius:50%;

    position:relative;

    overflow:hidden;

    transform-style:preserve-3d;

    cursor:grab;

    background:
    radial-gradient(circle at 30% 20%,
    rgba(255,255,255,.9),
    rgba(255,255,255,.12) 28%,
    rgba(0,40,90,.96) 100%);

    border:8px solid rgba(255,255,255,.22);

    box-shadow:
    inset 0 0 40px rgba(255,255,255,.35),
    0 0 60px rgba(0,255,255,.2),
    0 0 150px rgba(0,170,255,.25);

    animation:float 4s ease-in-out infinite;
}

@keyframes float{

    0%,100%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-12px);
    }

}

/* reflejo */

.reflection{

    position:absolute;

    width:130px;
    height:250px;

    border-radius:50%;

    background:
    linear-gradient(
    to bottom,
    rgba(255,255,255,.55),
    transparent);

    top:18px;
    left:35px;

    transform:rotate(-18deg);

}

/* jardín */

.garden{

    position:absolute;

    width:100%;
    height:125px;

    bottom:0;

    background:
    linear-gradient(to top,
    #0d6416,
    #36d336);

    border-radius:50% 50% 0 0;

    overflow:hidden;
}

/* pasto */

.grass{

    position:absolute;

    bottom:0;

    width:100%;
    height:40px;

    background:
    repeating-linear-gradient(
    90deg,
    #2ed82e 0px,
    #2ed82e 4px,
    #176817 5px,
    #176817 8px
    );

}

/* flores */

.flower{
    position:absolute;
    width:12px;
    height:12px;
    border-radius:50%;
    bottom:35px;

    box-shadow:
    12px 0 currentColor,
    -12px 0 currentColor,
    0 12px currentColor,
    0 -12px currentColor;
}

.f1{
    left:60px;
    color:pink;
}

.f2{
    left:130px;
    color:yellow;
}

.f3{
    right:80px;
    color:cyan;
}

.f4{
    right:150px;
    color:#ff66ff;
}

/* FOTO */

.photo-container{

    position:absolute;

    left:50%;
    top:50%;

    transform:
    translate(-50%,-58%)
    rotateY(0deg);

    transform-style:preserve-3d;

    transition:transform .15s linear;

}

.photo{

    width:195px;
    height:195px;

    border-radius:50%;

    object-fit:cover;

    border:7px solid rgba(255,255,255,.75);

    box-shadow:
    0 0 35px rgba(255,255,255,.4),
    0 0 70px rgba(255,0,200,.25);

    animation:spinPhoto 10s linear infinite;
}

@keyframes spinPhoto{

    from{
        transform:rotateY(0deg);
    }

    to{
        transform:rotateY(360deg);
    }

}

/* BASE */

.base{

    position:absolute;

    width:290px;
    height:100px;

    bottom:-68px;

    left:50%;

    transform:translateX(-50%);

    background:
    linear-gradient(to bottom,
    #77441b,
    #2c1306);

    border-radius:28px;

    box-shadow:
    inset 0 6px 10px rgba(255,255,255,.2),
    0 15px 25px rgba(0,0,0,.6);
}

.base::before{

    content:"❤ NAY ❤";

    position:absolute;

    left:50%;
    top:30px;

    transform:translateX(-50%);

    color:white;

    font-size:26px;

    font-weight:bold;

    letter-spacing:5px;

    text-shadow:
    0 0 10px #ff00ff,
    0 0 20px #00ffff,
    0 0 30px #ff00ff;
}

/* nieve */

.snow{

    position:absolute;

    background:white;

    border-radius:50%;

    pointer-events:none;

    animation:fall linear forwards;
}

@keyframes fall{

    from{
        transform:translateY(-20px);
        opacity:1;
    }

    to{
        transform:translateY(500px);
        opacity:0;
    }

}

/* brillos */

.spark{

    position:absolute;

    width:5px;
    height:5px;

    border-radius:50%;

    background:white;

    box-shadow:
    0 0 10px white,
    0 0 20px cyan,
    0 0 30px cyan;

    animation:spark 1.4s linear forwards;
}

@keyframes spark{

    from{

        transform:
        scale(.2);

        opacity:1;
    }

    to{

        transform:
        translateY(-100px)
        scale(2);

        opacity:0;
    }

}

/* responsive */

@media(max-width:480px){

    .scene{
        width:340px;
        height:340px;
    }

    .photo{
        width:160px;
        height:160px;
    }

    .base{
        width:240px;
    }

}

</style>
</head>
<body>

<div class="bg"></div>

<div class="overlay"></div>

<div class="light light1"></div>
<div class="light light2"></div>

<div class="text">

    <h1>❄ Mi Ojitos de Uva ❄</h1>

    <p>
        Toca o agita tu celular ✨
    </p>

</div>

<div class="scene">

    <div class="globe" id="globe">

        <div class="reflection"></div>

        <!-- FOTO -->

        <div
        class="photo-container"
        id="photoContainer">

            <img
            src="./IMG-20260512-WA0005.jpg"
            class="photo">

        </div>

        <!-- JARDIN -->

        <div class="garden">

            <div class="grass"></div>

            <div class="flower f1"></div>
            <div class="flower f2"></div>
            <div class="flower f3"></div>
            <div class="flower f4"></div>

        </div>

    </div>

    <div class="base"></div>

</div>

<!-- Música -->

<audio
id="music"
autoplay
loop>

<source
src="https://files.catbox.moe/6r6q7l.mp3"
type="audio/mpeg">

</audio>

<script>

const globe =
document.getElementById("globe");

const photoContainer =
document.getElementById(
"photoContainer"
);

/* nieve */

function snow(amount=60){

    for(let i=0;i<amount;i++){

        const snow =
        document.createElement("div");

        snow.className="snow";

        const size =
        Math.random()*7+2;

        snow.style.width =
        size+"px";

        snow.style.height =
        size+"px";

        snow.style.left =
        Math.random()*100+"%";

        snow.style.top =
        "-20px";

        snow.style.animationDuration =
        (Math.random()*3+2)+"s";

        globe.appendChild(snow);

        setTimeout(()=>{

            snow.remove();

        },5000);

    }

}

/* brillos */

function sparks(amount=35){

    for(let i=0;i<amount;i++){

        const spark =
        document.createElement("div");

        spark.className="spark";

        spark.style.left =
        Math.random()*100+"%";

        spark.style.top =
        Math.random()*100+"%";

        globe.appendChild(spark);

        setTimeout(()=>{

            spark.remove();

        },1500);

    }

}

/* efecto */

function shakeEffect(){

    globe.animate([

        { transform:'translateX(-8px)' },

        { transform:'translateX(8px)' },

        { transform:'translateX(-8px)' },

        { transform:'translateX(0px)' }

    ],{

        duration:500

    });

    snow(100);
    sparks(60);

}

/* click */

globe.addEventListener(
"click",
()=>{

    shakeEffect();

});

/* movimiento 3D */

document.addEventListener(
"mousemove",
(e)=>{

    const x =
    (window.innerWidth/2-e.pageX)/18;

    const y =
    (window.innerHeight/2-e.pageY)/18;

    globe.style.transform =

    `rotateY(${-x}deg)
    rotateX(${y}deg)`;

    photoContainer.style.transform =

    `translate(-50%,-58%)
    rotateY(${x*2}deg)`;

});

/* celular */

let lastX,lastY,lastZ;

window.addEventListener(
"devicemotion",
(event)=>{

const acc =
event.accelerationIncludingGravity;

if(!acc) return;

if(lastX!==undefined){

const total =

Math.abs(lastX-acc.x)+
Math.abs(lastY-acc.y)+
Math.abs(lastZ-acc.z);

if(total>22){

shakeEffect();

}

}

lastX=acc.x;
lastY=acc.y;
lastZ=acc.z;

});

/* nieve automática */

setInterval(()=>{

snow(10);

},1200);

/* música */

window.addEventListener(
"click",
()=>{

document
.getElementById("music")
.play();

},{once:true});

</script>

</body>
</html>
